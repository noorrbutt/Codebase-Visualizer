name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: codebase_visualizer
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d codebase_visualizer"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/codebase_visualizer
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
      - name: Verify PostgreSQL migrations
        run: |
          cd backend
          alembic upgrade head && alembic downgrade base && alembic upgrade head
      - name: Ruff lint
        run: |
          ruff check backend
      - name: Run tests
        run: |
          pytest backend/tests

  backend-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
      - name: Audit backend dependencies
        run: |
          pip-audit -r backend/requirements.txt
        continue-on-error: false

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # ESLint 10.4.1 requires Node >=20.19 for util.styleText support.
          node-version: '22'
      - name: Install frontend deps
        run: |
          cd frontend
          npm ci
      - name: Audit frontend dependencies
        run: |
          cd frontend
          npm audit --audit-level=high
        continue-on-error: false
      - name: Run frontend unit tests
        run: |
          cd frontend
          npm test
      - name: Lint frontend
        run: |
          cd frontend
          npm run lint
      - name: Install Playwright Chromium
        run: |
          cd frontend
          npx playwright install --only-shell chromium
      - name: Run Playwright smoke tests
        run: |
          cd frontend
          npm run test:e2e

  backend-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend Docker image
        run: docker build -t codebase-visualizer-backend ./backend
